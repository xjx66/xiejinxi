<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uniunion</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
                "talkinghead": "./TalkingHead/modules/talkinghead.mjs",
                "headtts": "./HeadTTS/modules/headtts.mjs"
            }
        }
    </script>
</head>
<body>
    <div id="scroll-progress"></div>
    <canvas id="particles"></canvas>
    
    <div id="offline-indicator"></div>
    <div class="container" style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; margin: 0; overflow: hidden;">
        
        <div id="avatar-dialogue-layer" aria-live="polite">
            <div id="avatar-dialogue-panel">
                <div id="avatar-dialogue-title">AI 操作面板</div>
                <div id="avatar-dialogue-hint">点击一个坐标或对象，锁定上下文后再上传资产并提交。</div>
                <div id="ai-action-mode">模式：未选择</div>
                <div id="ai-context-summary">
                    <div class="ai-context-row">
                        <span class="ai-context-label">坐标</span>
                        <span id="ai-context-coordinate">未锁定</span>
                    </div>
                    <div class="ai-context-row">
                        <span class="ai-context-label">目标</span>
                        <span id="ai-context-target">空白点位</span>
                    </div>
                </div>
                <div id="ai-asset-summary">
                    <div class="ai-asset-title">资产信息</div>
                    <div id="ai-asset-fields">未选中对象</div>
                </div>
                <div id="ai-video-controls">
                    <div class="ai-asset-title">视频控制</div>
                    <button id="ai-video-toggle" type="button">播放</button>
                    <input id="ai-video-progress" type="range" min="0" max="1000" value="0">
                    <div id="ai-video-time">00:00 / 00:00</div>
                </div>
                <div id="avatar-dialogue-controls">
                    <textarea id="ai-prompt-text" autocomplete="off" placeholder="输入你的意图，例如：在这里插入一个悬浮视频屏，或把这个对象替换成玻璃雕塑。"></textarea>
                </div>
                <div id="ai-upload-section">
                    <label id="ai-upload-label" for="ai-upload-input">上传资产</label>
                    <input id="ai-upload-input" type="file" accept=".png,.jpg,.jpeg,.webp,.mp4,.glb">
                    <div id="ai-upload-preview">未选择文件</div>
                </div>
                <div id="ai-action-buttons">
                    <button id="ai-submit" type="button">确认执行</button>
                    <button id="ai-delete" type="button">删除对象</button>
                    <button id="ai-reset" type="button">清空上下文</button>
                </div>
                <div id="avatar-dialogue-loading">Waiting for input...</div>
            </div>
        </div>

        <div id="world-coordinate-hud" aria-live="polite">
            <div id="world-coordinate-title">World Origin O(0,0,0)</div>
            <div id="world-coordinate-value">X 0.00  Y 0.00  Z 0.00</div>
            <div id="world-click-coordinate-label">Pick</div>
            <div id="world-click-coordinate-value">X 0.00  Y 0.00  Z 0.00</div>
        </div>
        <button id="collision-debug-toggle" type="button">Collision Off</button>

        <button id="themeToggle" class="theme-toggle">🌖</button>

        <div id="hearts-container"></div>
        <div id="cursor-follower"></div>

    <div id="floating-quote"></div>

    </div>
    <script src="script.js?v=2"></script>
    <script type="module" src="talkinghead.js?v=3"></script>
</body>
</html>
